name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint
      - run: npm run build
      - run: npm run audit:structure
      - run: npm run docs:genres:check
      - run: npm run privacy:scan
      - run: npm pack --dry-run

  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        node: ['22', '24']
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y ffmpeg libxml2-utils
      - run: npm ci
      - run: npm test
        env:
          MUSIC2_REQUIRE_FFMPEG: ${{ runner.os == 'Linux' && '1' || '' }}

  ci:
    if: always()
    needs: [checks, test]
    runs-on: ubuntu-latest
    steps:
      - name: Require all jobs
        env:
          CHECKS: ${{ needs.checks.result }}
          TEST: ${{ needs.test.result }}
        run: test "$CHECKS" = success && test "$TEST" = success
